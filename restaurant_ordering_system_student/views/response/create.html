<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Response - Member View</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Restaurant Ordering System</a>
            <div class="navbar-nav ms-auto align-items-center">
                <span class="navbar-text me-3">Welcome, Member</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        <!-- Back Button -->
        <div class="mb-3">
            <a id="back-to-detail" href="#" class="btn btn-outline-secondary btn-sm">
                ← Back to Product Detail
            </a>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-5" style="display:none;">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Response Section -->
        <div id="response-section" class="mt-4">
            <h5>Create a Response</h5>

            <!-- Error Message -->
            <div id="error-message" class="alert alert-danger" style="display:none;"></div>

            <!-- Response Form -->
            <form id="response-form" class="card card-body">
                <input type="hidden" id="feedback-id" name="feedback_id">
                <div class="mb-3">
                    <label for="response-comment" class="form-label">Comment</label>
                    <textarea id="response-comment" class="form-control" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Response</button>
            </form>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1055">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toast helper -->
    <script src="/js/toastHelper.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('productId');
        const feedbackId = params.get('feedbackId');

        // Back link to product detail
        const backLink = document.getElementById('back-to-detail');
        backLink.href = `/member/product-detail?id=${productId}`;

        // Inject feedbackId into hidden field
        document.getElementById('feedback-id').value = feedbackId;

        const responseForm = document.getElementById('response-form');
        const errorMessage = document.getElementById('error-message');
        const loading = document.getElementById('loading');

        // Handle response submission
        responseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            
            const comment = document.getElementById('response-comment').value.trim();
            if (!comment) return;

            loading.style.display = 'block';
            const submitBtn = responseForm.querySelector('button');
            submitBtn.disabled = true;

            try {
                const res = await fetch(`/response/feedback/${feedbackId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment })
                });

                const data = await res.json();
                loading.style.display = 'none';
                submitBtn.disabled = false;

                if (res.ok && data.success) {
                    showToast(data.message || 'Response created successfully.',
                        `/member/product-detail?id=${productId}`);
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = data.message || 'Failed to create response.';
                }
            } catch (err) {
                console.error('Error creating response:', err);
                loading.style.display = 'none';
                submitBtn.disabled = false;
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Unexpected error occurred.';
            }
        });
    </script>
</body>

</html>
