<!-- views/dashboard.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Restaurant Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Restaurant System</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" id="user-welcome"></span>
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Restaurant Management Dashboard</h2>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Filters</h5>
                <form id="filter-form" method="GET" action="/dashboard">

                    <div class="row">
                        <div class="col-md-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date">
                        </div>
                        <div class="col-md-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date">
                        </div>
                        <div class="col-md-3">
                            <label for="category" class="form-label">Product Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="">All Categories</option>
                                <!-- Categories populated by JS -->
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="customer_name" class="form-label">Customer Name</label>
                            <input type="text" class="form-control" id="customer_name" name="customer_name"
                                placeholder="All Customers">
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-3">
                            <label for="sort_by" class="form-label">Sort By</label>
                            <select class="form-select" id="sort_by" name="sort_by">
                                <option value="order_date">Order Date</option>
                                <option value="total_amount">Total Amount</option>
                                <option value="customer_name">Customer Name</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="sort_order" class="form-label">Sort Order</label>
                            <select class="form-select" id="sort_order" name="sort_order">
                                <option value="ASC">Ascending</option>
                                <option value="DESC">Descending</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="min_amount" class="form-label">Min Amount</label>
                            <input type="number" step="0.01" class="form-control" id="min_amount" name="min_amount"
                                placeholder="e.g. 10.00">
                        </div>
                        <div class="col-md-3">
                            <label for="max_amount" class="form-label">Max Amount</label>
                            <input type="number" step="0.01" class="form-control" id="max_amount" name="max_amount"
                                placeholder="e.g. 100.00">
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-3">
                            <label for="status" class="form-label">Order Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="">All Statuses</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary me-2">Apply Filters</button>
                            <button type="button" class="btn btn-secondary" onclick="clearFilters()">Clear</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title" id="order-summary-title">Order Summary</h5>
                <div id="no-orders" class="alert alert-info" style="display: none;">
                    No orders found matching the current filters.
                </div>
                <div id="orders-table-container" class="table-responsive">
                    <table class="table table-striped" id="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Items</th>
                                <th>Products</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Orders will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterForm = document.getElementById('filter-form');
            const ordersTbody = document.getElementById('orders-tbody');
            const categoriesSelect = document.getElementById('category');
            const noOrdersAlert = document.getElementById('no-orders');

            // Fetch dashboard data
            async function fetchDashboard(params = {}) {
                const query = new URLSearchParams(params).toString();
                const response = await fetch(`/api/dashboard?${query}`);
                const data = await response.json();

                if (!data.success) {
                    console.error('Error fetching dashboard:', data.message);
                    return;
                }

                // Populate categories dropdown
                const categoriesSelect = document.getElementById('category');
                categoriesSelect.length = 1; // keep "All Categories"
                data.categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categoriesSelect.appendChild(option);
                });

                // Populate statuses dropdown
                const statusSelect = document.getElementById('status');
                statusSelect.length = 1; // keep "All Statuses"
                data.statuses.forEach(st => {
                    const option = document.createElement('option');
                    option.value = st;
                    option.textContent = st;
                    statusSelect.appendChild(option);
                });
                // Populate orders table
                ordersTbody.innerHTML = '';
                if (data.orders.length === 0) {
                    noOrdersAlert.style.display = 'block';
                } else {
                    noOrdersAlert.style.display = 'none';
                    data.orders.forEach(order => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
          <td>#${order.order_id}</td>
          <td>${order.customer_name || order.username}</td>
          <td>${new Date(order.order_date).toLocaleDateString()}</td>
          <td>$${order.total_amount}</td>
          <td>
            <span class="badge ${order.status === 'COMPLETED' ? 'bg-success' :
                                order.status === 'CANCELLED' ? 'bg-danger' :
                                    order.status === 'PACKING' ? 'bg-warning' :
                                        'bg-secondary'
                            }">
              ${order.status}
            </span>
          </td>
          <td>${order.item_count}</td>
          <td>${order.product_list}</td>
          `;
                        ordersTbody.appendChild(tr);
                    });
                }
            }

            // Handle filter form submit
            filterForm.addEventListener('submit', e => {
                e.preventDefault();
                const params = {
                    start_date: document.getElementById('start_date').value,
                    end_date: document.getElementById('end_date').value,
                    category: document.getElementById('category').value,
                    sort_by: document.getElementById('sort_by').value,
                    sort_order: document.getElementById('sort_order').value,
                    customer_name: document.getElementById('customer_name').value,
                    status: document.getElementById('status').value,
                    min_amount: document.getElementById('min_amount').value,
                    max_amount: document.getElementById('max_amount').value
                };
                fetchDashboard(params);
            });

            // Clear filters
            window.clearFilters = () => {
                filterForm.reset();
                fetchDashboard();
            };

            // Initial load
            fetchDashboard();
        });
    </script>

</body>

</html>
