<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Feedback - Member View</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Restaurant Ordering System</a>
            <div class="navbar-nav ms-auto align-items-center">
                <span class="navbar-text me-3">Welcome, Member</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        <!-- Back Button -->
        <div class="mb-3">
            <a href="/member/feedback" class="btn btn-outline-secondary btn-sm">
                ← Back to My Feedback
            </a>
        </div>
        <h4 class="mb-3">Edit Feedback</h4>

        <!-- Loading State -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="alert alert-danger" style="display: none;">
            Failed to load feedback.
        </div>

        <!-- Feedback Form -->
        <form id="edit-feedback-form" class="card card-body" style="display: none;">
            <div class="mb-3">
                <label for="feedback-rating" class="form-label">Rating (1-5)</label>
                <input type="number" id="feedback-rating" class="form-control" min="1" max="5" required>
            </div>
            <div class="mb-3">
                <label for="feedback-comment" class="form-label">Comment</label>
                <textarea id="feedback-comment" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Feedback</button>
            <a href="/member/feedback" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </main>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1055">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    <!-- Message will be injected here -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toast helper -->
    <script src="/js/toastHelper.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const feedbackId = params.get('feedback_id');

            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('error-message');
            const form = document.getElementById('edit-feedback-form');

            if (!feedbackId) {
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'No feedback specified.';
                return;
            }

            // Fetch existing feedback to pre-fill form
            try {
                const response = await fetch(`/feedback/${feedbackId}`);
                const data = await response.json();

                loading.style.display = 'none';

                if (response.ok && data.success && data.feedback) {
                    document.getElementById('feedback-rating').value = data.feedback.rating;
                    document.getElementById('feedback-comment').value = data.feedback.comment;
                    form.style.display = 'block';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = data.message || errorMessage.textContent;
                }
            }
            catch (err) {
                console.error('Error loading feedback:', err);
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Unexpected error occurred.';
            }

            // Handle form submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const rating = document.getElementById('feedback-rating').value;
                const comment = document.getElementById('feedback-comment').value;

                try {
                    const response = await fetch(`/feedback/${feedbackId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rating, comment })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showToast(data.message, '/member/feedback');
                    } else {
                        errorMessage.style.display = 'block';
                        errorMessage.textContent = data.message || 'Failed to update feedback.';
                    }
                } catch (err) {
                    console.error('Error updating feedback:', err);
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Unexpected error occurred.';
                }
            });
        });
    </script>
</body>

</html>
