<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Feedback - Member View</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation Bar (identical to products.html) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">

    <!-- Back Button -->
    <div class="mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">
        ← Back to Products
      </a>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-message" class="alert alert-danger" style="display: none;">
      Failed to load feedback.
    </div>

    <!-- Feedback List -->
    <div id="feedback-section" style="display: none;">
      <h4 class="mb-3">My Feedback</h4>
      <div id="feedback-list"></div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchMyFeedback();
    });

    async function fetchMyFeedback() {
      try {
        const response = await fetch('/feedback');
        const data = await response.json();

        const feedbackSection = document.getElementById('feedback-section');
        const feedbackList = document.getElementById('feedback-list');
        const errorMessage = document.getElementById('error-message');
        const loading = document.getElementById('loading');

        // Reset UI
        feedbackList.innerHTML = '';
        loading.style.display = 'none';
        errorMessage.style.display = 'none';

        if (!response.ok || !data.success) {
          errorMessage.textContent = data.message || errorMessage.textContent;
          errorMessage.style.display = 'block';
          return;
        }

        // Render feedback cards
        feedbackSection.style.display = 'block';

        data.feedback.forEach(fb => {
          const fbCard = document.createElement('div');
          fbCard.className = 'card mb-2';
          fbCard.innerHTML = `
        <div class="card-body">
          <strong>Feedback ID:</strong> ${fb.feedback_id}<br>
          <strong>Product:</strong> ${fb.product_name}<br>
          <strong>Rating:</strong> ${'★'.repeat(fb.rating)}<br>
          <strong>Comment:</strong> ${fb.comment}<br>
          <small class="text-muted">Last Updated: ${new Date(fb.updated_at).toLocaleString()}</small><br>
          <div class="mt-2">
            <a href="/member/feedback/edit?feedback_id=${fb.feedback_id}"  
               class="btn btn-sm btn-outline-primary me-2">Edit</a>
            <button class="btn btn-sm btn-outline-danger" 
                    onclick="deleteFeedback(${fb.feedback_id})">Delete</button>
          </div>
        </div>
      `;
          feedbackList.appendChild(fbCard);
        });

      } catch (error) {
        console.error('Error fetching feedback:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-message').style.display = 'block';
      }
    }


    async function deleteFeedback(feedbackId) {
      if (!confirm('Are you sure you want to delete this feedback?')) return;

      try {
        const response = await fetch(`/feedback/${feedbackId}`, { method: 'DELETE' });
        const data = await response.json();
        if (response.ok) {
          fetchMyFeedback(); // reload list after deletion
        } else {
          alert(data.message || 'Failed to delete feedback.');
        }
      } catch (error) {
        console.error('Error deleting feedback:', error);
        alert('Error deleting feedback.');
      }
    }
  </script>
</body>

</html>
