<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Member View</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation Bar (identical to products.html) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">
    <!-- Back Button -->
    <div class="mb-3">
      <a id="back-to-detail" href="#" class="btn btn-outline-secondary btn-sm">
        ← Back to Product Detail
      </a>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-5" style="display:none;">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Feedback Section -->
    <div id="feedback-section" class="mt-4">
      <h5>Feedback for this Product</h5>
      <div id="feedback-list" class="mb-3"></div>

      <!-- Feedback Form -->
      <form id="feedback-form" class="card card-body">
        <div class="mb-3">
          <label for="feedback-rating" class="form-label">Rating (1-5)</label>
          <input type="number" id="feedback-rating" class="form-control" min="1" max="5" required>
        </div>
        <div class="mb-3">
          <label for="feedback-comment" class="form-label">Comment</label>
          <textarea id="feedback-comment" class="form-control" rows="2" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Feedback</button>
      </form>
    </div>

    <script>
      const productId = new URLSearchParams(window.location.search).get('productId');
        const backLink = document.getElementById('back-to-detail');
        backLink.href = `/member/product-detail?id=${productId}`;
        
      document.getElementById('feedback-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const rating = document.getElementById('feedback-rating').value;
        const comment = document.getElementById('feedback-comment').value;
        const loading = document.getElementById('loading');

        // Show spinner
        loading.style.display = 'block';

        try {
          const response = await fetch(`/feedback/product/${productId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rating, comment })
          });

          const data = await response.json();
          loading.style.display = 'none';

          if (response.ok) {
            alert('Feedback created successfully!');
            window.location.href = `/member/product-detail?id=${productId}`;
          } else {
            alert(data.message || 'Failed to submit feedback.');
          }
        } catch (err) {
          console.error('Error submitting feedback:', err);
          loading.style.display = 'none';
          alert('Unexpected error occured');
        }
      });
    </script>
