<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Member View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark restaurant-navbar">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-0">Our Menu</h2>
        <p class="text-muted mb-0">Fresh picks, made to order.</p>
      </div>
      <div class="d-flex gap-2">
        <a id="my-cart-link" href="#" class="btn btn-outline-primary btn-sm">
          My Cart 🛒
        </a>
        <a href="/member/feedback" class="btn btn-secondary btn-sm">
          My Feedback
        </a>
      </div>
    </div>

    <div id="product-grid" class="menu-grid"></div>

    <div id="no-products" class="alert alert-info mt-3" style="display: none;">
      No products available.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Emoji shown on each menu card, picked from the product's category.
    const CATEGORY_ICONS = {
      appetizer: '🥗', appetizers: '🥗', starter: '🥗',
      main: '🍽️', mains: '🍽️', entree: '🍽️', 'main course': '🍽️',
      dessert: '🍰', desserts: '🍰', sweets: '🍰',
      drink: '🥤', drinks: '🥤', beverage: '🥤', beverages: '🥤',
      pizza: '🍕', pasta: '🍝', burger: '🍔', burgers: '🍔',
      seafood: '🦞', soup: '🍲', soups: '🍲', salad: '🥗', salads: '🥗',
      breakfast: '🍳', sides: '🍟', side: '🍟'
    };

    function iconFor(category) {
      if (!category) return '🍴';
      return CATEGORY_ICONS[category.toLowerCase().trim()] || '🍴';
    }

    document.addEventListener('DOMContentLoaded', fetchProducts);

    async function fetchProducts() {
      try {
        const response = await fetch('/products');
        const data = await response.json();

        const grid = document.getElementById('product-grid');
        const noProducts = document.getElementById('no-products');

        grid.innerHTML = '';

        if (!data.success || data.products.length === 0) {
          noProducts.style.display = 'block';
          return;
        }

        data.products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'menu-card';

          const cartOrUnavailableBtn = product.is_available
            ? `<a href="/member/cart/create?ref=products&productId=${product.product_id}"
                 class="btn btn-success btn-sm">Add to Cart</a>`
            : `<a href="#" class="btn btn-secondary btn-sm disabled" aria-disabled="true">Unavailable</a>`;

          card.innerHTML = `
            <div class="menu-card__media">${iconFor(product.category)}</div>
            <div class="menu-card__body">
              <div class="menu-card__category">${product.category || 'Menu Item'}</div>
              <div class="menu-card__name">${product.name}</div>
              <div class="menu-card__desc">${product.description || 'No description available.'}</div>
              <div class="mb-2">
                <span class="badge ${product.is_available ? 'badge-available' : 'badge-unavailable'}">
                  ${product.is_available ? 'Available' : 'Unavailable'}
                </span>
              </div>
              <div class="menu-card__footer">
                <span class="price-tag">$${parseFloat(product.price).toFixed(2)}</span>
                <div class="d-flex gap-2">
                  <a href="/member/product-detail?id=${product.product_id}" class="btn btn-outline-primary btn-sm">
                    Details
                  </a>
                  ${cartOrUnavailableBtn}
                </div>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });

        // Set the "My Cart" link dynamically here after getting product id
        const myCartLink = document.getElementById('my-cart-link');
        myCartLink.href = `/member/cart/retrieve/all?ref=products`;
      } catch (error) {
        console.error('Error fetching products:', error);
        alert('Failed to load products.');
      }
    }
  </script>
</body>

</html>
