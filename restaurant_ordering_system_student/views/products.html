<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Member View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title d-flex justify-content-between align-items-center">
          <span>Available Products</span>
          <!-- New Feedback Button -->
          <div class="d-flex gap-2">
            <a id="my-cart-link" href="#" class="btn btn-outline-primary btn-sm">
              My Cart 🛒
            </a>
            <a href="/member/feedback" class="btn btn-secondary btn-sm">
              My Feedback
            </a>
          </div>
        </h4>

        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Price ($)</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>

        <div id="no-products" class="alert alert-info mt-3" style="display: none;">
          No products available.
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', fetchProducts);

    async function fetchProducts() {
      try {
        const response = await fetch('/products');
        const data = await response.json();

        const tbody = document.getElementById('product-table-body');
        const noProducts = document.getElementById('no-products');

        tbody.innerHTML = '';

        if (!data.success || data.products.length === 0) {
          noProducts.style.display = 'block';
          return;
        }

        data.products.forEach(product => {
          const row = document.createElement('tr');

          row.innerHTML = `
            <td>${product.name}</td>
            <td>${product.description || '-'}</td>
            <td>${product.category || '-'}</td>
            <td>${parseFloat(product.price).toFixed(2)}</td>
            <td>
              <span class="badge ${product.is_available ? 'bg-success' : 'bg-secondary'}">
                ${product.is_available ? 'Available' : 'Unavailable'}
              </span>
            </td>
            <td>${new Date(product.created_at).toLocaleDateString()}</td>
            <td>
              <a href="/member/product-detail?id=${product.product_id}" class="btn btn-primary btn-sm">
                View Details
              </a>
              ${product.is_available
              ? `<a href="/member/cart/create?ref=products&productId=${product.product_id}" 
             class="btn btn-success btn-sm ms-2">
             Add to Cart
           </a>`
              : `<a href="#" class="btn btn-secondary btn-sm ms-2 disabled" 
             aria-disabled="true">
             Unavailable
           </a>`
            }
            </td>
          `;

          tbody.appendChild(row);
        });

        // Set the "My Cart" link dynamically here after getting product id
        const myCartLink = document.getElementById('my-cart-link');
        myCartLink.href = `/member/cart/retrieve/all?ref=products`;
      } catch (error) {
        console.error('Error fetching products:', error);
        alert('Failed to load products.');
      }
    }
  </script>
</body>

</html>
