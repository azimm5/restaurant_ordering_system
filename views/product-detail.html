<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Member View</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation Bar (identical to products.html) -->
  <nav class="navbar navbar-expand-lg navbar-dark restaurant-navbar">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">

    <!-- Back and Make Feedback Buttons -->
    <div class="d-flex justify-content-between mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">
        ← Back to Products
      </a>
      <div class="d-flex gap-2">
        <a id="my-cart-link" href="#" class="btn btn-outline-primary btn-sm">
          My Cart 🛒
        </a>
        <a id="make-feedback-link" href="#" class="btn btn-primary btn-sm">
          Make Feedback
        </a>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border spinner-brand" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-message" class="alert alert-danger" style="display: none;">
      Failed to load product details.
    </div>

    <!-- Product Detail Card -->
    <div id="product-detail" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4" id="detail-name"></h4>

          <table class="table table-striped align-middle">
            <tbody>
              <tr>
                <th scope="row" style="width: 200px;">Category</th>
                <td id="detail-category"></td>
              </tr>
              <tr>
                <th scope="row">Description</th>
                <td id="detail-description"></td>
              </tr>
              <tr>
                <th scope="row">Price</th>
                <td id="detail-price"></td>
              </tr>
              <tr>
                <th scope="row">Status</th>
                <td id="detail-status"></td>
              </tr>
              <tr>
                <th scope="row">Created At</th>
                <td id="detail-created-at"></td>
              </tr>
              <tr>
                <th scope="row">Add to Cart</th>
                <td>
                  <a id="add-to-cart-link" href="#" class="btn btn-success btn-sm">
                    Add to Cart
                  </a>
                </td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>

    <!-- Feedback Section -->
    <div id="feedback-section" class="mt-4" style="display: none;">
      <h5>Feedback for this Product</h5>

      <!-- Feedback Loading -->
      <div id="feedback-loading" class="text-center py-3" style="display: none;">
        <div class="spinner-border spinner-brand" role="status">
          <span class="visually-hidden">Loading feedback...</span>
        </div>
      </div>

      <!-- error box for feedback -->
      <div id="feedback-error" class="alert alert-danger" style="display: none;">
        Failed to load feedback.
      </div>

      <div id="feedback-list" class="mb-3"></div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1055">
    <div id="successToast" class="toast align-items-center text-white toast-success border-0" role="alert"
      aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">
          <!-- Message will be injected here -->
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toast helper -->
  <script src="/js/toastHelper.js"></script>

  <script>
    // Grab productId from query string 
    const productId = new URLSearchParams(window.location.search).get('id');
    let currentUserId = null;

    // Fetch current user from /api/auth/status
    async function getCurrentUser() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (data.authenticated) {
          currentUserId = data.user.id;
        }
      } catch (err) {
        console.error('Failed to fetch auth status:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await getCurrentUser();   // ensure who is logged in
      fetchProductDetail();
    });

    async function fetchProductDetail() {
      const loading = document.getElementById('loading');
      const errorMessage = document.getElementById('error-message');
      const productDetail = document.getElementById('product-detail');

      // If no product ID is present in the URL, show error immediately
      if (!productId) {
        loading.style.display = 'none';
        errorMessage.style.display = 'block';
        errorMessage.textContent = 'No product specified.';
        return;
      }

      try {
        const response = await fetch(`/products/${productId}`);
        const data = await response.json();

        loading.style.display = 'none';
        if (!response.ok || !data.product) {
          errorMessage.style.display = 'block';
          return;
        }

        const product = data.product;

        document.title = `${product.name} - Member View`;
        document.getElementById('detail-name').textContent = product.name;
        document.getElementById('detail-category').textContent = product.category || '-';
        document.getElementById('detail-description').textContent = product.description || '-';
        document.getElementById('detail-price').textContent = `$${parseFloat(product.price).toFixed(2)}`;
        document.getElementById('detail-created-at').textContent = new Date(product.created_at).toLocaleDateString();

        // Add to Cart link — disabled when the product isn't available
        const addToCartLink = document.getElementById('add-to-cart-link');
        if (product.is_available) {
          addToCartLink.href = `/member/cart/create?ref=detail&productId=${product.product_id}`; 
          addToCartLink.classList.remove('disabled');
          addToCartLink.removeAttribute('aria-disabled');
          addToCartLink.textContent = 'Add to Cart';
        } else {
          addToCartLink.href = '#';
          addToCartLink.classList.add('disabled');
          addToCartLink.setAttribute('aria-disabled', 'true');
          addToCartLink.textContent = 'Unavailable';
        }
        // Render availability badge
        const statusCell = document.getElementById('detail-status');
        statusCell.innerHTML = `
          <span class="badge ${product.is_available ? 'badge-available' : 'badge-unavailable'}">
            ${product.is_available ? 'Available' : 'Unavailable'}
          </span>
        `;

        productDetail.style.display = 'block';

        // Set the "My Cart" link dynamically here after getting product id
        const myCartLink = document.getElementById('my-cart-link');
        myCartLink.href = `/member/cart/retrieve/all?ref=detail&productId=${product.product_id}`;

        // Set the "Make Feedback" link dynamically here after getting product id
        const feedbackLink = document.getElementById('make-feedback-link');
        feedbackLink.href = `/member/feedback/create?productId=${product.product_id}`;

        // Load feedback after product details
        fetchFeedback(productId);

      } catch (error) {
        console.error('Error fetching product detail:', error);
        loading.style.display = 'none';
        errorMessage.style.display = 'block';
      }
    }

    async function fetchFeedback(productId) {

      const feedbackSection = document.getElementById('feedback-section');
      const feedbackLoading = document.getElementById('feedback-loading');
      const feedbackError = document.getElementById('feedback-error');
      const feedbackList = document.getElementById('feedback-list');

      feedbackSection.style.display = 'block';
      feedbackLoading.style.display = 'block';
      feedbackError.style.display = 'none';
      feedbackList.innerHTML = '';

      try {
        const response = await fetch(`/feedback/product/${productId}`);
        const data = await response.json();

        feedbackLoading.style.display = 'none';

        if (!response.ok || !data.success) {
          feedbackError.style.display = 'block';
          feedbackError.textContent = data.message || 'Failed to load feedback.';
          return;
        }

        data.feedback.forEach(fb => {
          const fbCard = document.createElement('div');
          fbCard.className = 'card mb-2';
          fbCard.innerHTML = `
        <div class="card-body">
          <strong>Rating:</strong> ${'★'.repeat(fb.rating)}<br>
          <strong>Comment:</strong> ${fb.comment}<br>
          <small class="text-muted">Last Updated: ${new Date(fb.updated_at).toLocaleString()}</small><br>
          <small class="text-muted">By: ${fb.username}</small>
        <!-- Responses section -->
      <div id="responses-${fb.feedback_id}" class="mt-2">
                <div id="responses-loading-${fb.feedback_id}" class="text-center py-2" style="display:none;">
                  <div class="spinner-border spinner-brand" role="status">
                    <span class="visually-hidden">Loading responses...</span>
                  </div>
                </div>
                <div id="responses-error-${fb.feedback_id}" class="alert alert-danger" style="display:none;">
                  Failed to load responses.
                </div>
                <div id="responses-list-${fb.feedback_id}"></div>
              </div>
            </div>`;
          feedbackList.appendChild(fbCard);

          // trigger responses fetch for this feedback
          fetchResponses(fb.feedback_id, fb.member_id);
        });

      } catch (error) {
        console.error('Error fetching feedback:', error);
        feedbackLoading.style.display = 'none';
        feedbackError.style.display = 'block';
        feedbackError.textContent = 'Unexpected error occurred while loading feedback.';
      }
    }

    async function fetchResponses(feedbackId, feedbackAuthorId) {
      const loading = document.getElementById(`responses-loading-${feedbackId}`);
      const errorBox = document.getElementById(`responses-error-${feedbackId}`);
      const list = document.getElementById(`responses-list-${feedbackId}`);

      loading.style.display = 'block';
      errorBox.style.display = 'none';
      list.innerHTML = '';

      try {
        const response = await fetch(`/response/feedback/${feedbackId}`);
        const data = await response.json();

        loading.style.display = 'none';

        if (!response.ok || !data.success) {
          errorBox.style.display = 'block';
          errorBox.textContent = data.message || 'Failed to load responses.';

          // Show "Create Response" button if not the feedback author
          if (currentUserId !== feedbackAuthorId) {
            const createBtn = document.createElement('a');
            createBtn.className = 'btn btn-sm btn-primary mt-2';
            createBtn.textContent = 'Create Response';
            createBtn.href = `/member/response/create?feedbackId=${feedbackId}&productId=${productId}`;
            list.appendChild(createBtn);
          }
          return;
        }

        data.responses.forEach(r => {
          const rDiv = document.createElement('div');
          rDiv.className = 'border-start ps-2 mb-1';
          rDiv.innerHTML = `
          <strong>Response:</strong> ${r.comment}<br>
          <small class="text-muted">By: ${r.username} at ${new Date(r.created_at).toLocaleString()}</small>
        `;

          // Only show delete button if current user owns this response
          if (r.member_id === currentUserId) {
            const delBtn = document.createElement('button');
            delBtn.className = 'btn btn-sm btn-danger mt-1';
            delBtn.textContent = 'Delete';
            delBtn.onclick = () => deleteResponse(r.response_id, feedbackId);

            // Wrap in a div so it sits neatly below the text
            const btnWrapper = document.createElement('div');
            btnWrapper.appendChild(delBtn);
            rDiv.appendChild(btnWrapper);
          }

          list.appendChild(rDiv);
        });

        if (currentUserId !== feedbackAuthorId) {
          const createBtn = document.createElement('a');
          createBtn.className = 'btn btn-sm btn-primary mt-2';
          createBtn.textContent = 'Create Response';
          createBtn.href = `/member/response/create?feedbackId=${feedbackId}&productId=${productId}`;
          list.appendChild(createBtn);
        }

      } catch (error) {
        console.error('Error fetching responses:', error);
        loading.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = 'Unexpected error occurred while loading responses.';
      }
    }

    // Delete response function
    async function deleteResponse(responseId, feedbackId) {
      if (!confirm('Are you sure you want to delete this response?')) return;

      try {
        const res = await fetch(`/response/${responseId}`, { method: 'DELETE' });
        const data = await res.json();

        if (res.ok && data.success) {
          showToast(data.message || 'Response deleted successfully.', null,
            () => fetchResponses(feedbackId) // reload responses after deletion
          );
        } else {
          alert(data.message || 'Failed to delete response.');
        }
      } catch (err) {
        console.error('Error deleting response:', err);
        alert('Error deleting response.');
      }
    }

  </script>
</body>

</html>
